spring.application.name=ecommerce

spring.datasource.url=jdbc:postgresql://localhost:5433/ecommerce_db
spring.datasource.username=postgres
spring.datasource.password=chuy
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables are created by db/schema.sql, Hibernate only validates them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database.platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open.in.view=false

# SQL logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#--- OpenAPI / Swagger UI (springdoc) ---
#- OpenAPI JSON: /v3/api-docs   |   Swagger UI: /swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

server.port=8080